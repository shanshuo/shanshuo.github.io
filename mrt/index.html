      display: flex;
      align-items: center;
      gap: 8px;

      gap: 8px;

  <script>
    (function () {
      const LINE_COLORS = { EW: '#009639', NS: '#d42e12', NE: '#9900aa', CC: '#fa9e0d', DT: '#005ec4', TE: '#9d5b25' };
      let data = null;

      const towardsEl = document.getElementById('towards');
      const destinationEl = document.getElementById('destination');
      const directionPanel = document.getElementById('direction-panel');
      const gatesContent = document.getElementById('gates-content');

      var STORAGE_KEY = 'mrt-gate-info-last';

      function getStationsAndTowards(lineKey) {
        if (!data || !data.lines[lineKey]) return { stations: [], towards: [] };
        var rows = data.lines[lineKey];
        var towardsSet = new Set();
        var stationOrder = [];
        rows.forEach(function (r) {
          towardsSet.add(r.towards);
          var name = (r.stationName || '').trim();
          if (name && stationOrder.indexOf(name) === -1) stationOrder.push(name);
        });
        return {
          stations: stationOrder,
          towards: Array.from(towardsSet).sort()
        };
      }

      function findRecord(lineKey, towardsVal, destinationVal) {
        if (!data || !data.lines[lineKey]) return null;
        var rows = data.lines[lineKey];
        var destTrim = (destinationVal || '').trim();
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i];
          if (r.towards !== towardsVal) continue;
          if ((r.stationName || '').trim() === destTrim) return r;
        }
        return null;
      }

      function loadSavedSelection() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch (e) {
          return {};
        }
      }

      function saveSelection(lineKey, towardsVal, destinationVal) {
        try {
          var saved = loadSavedSelection();
          saved[lineKey] = { towards: towardsVal, destination: destinationVal };
          saved.lastLine = lineKey;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
        } catch (e) {}
      }

      function renderPills(arr) {
        if (!arr || arr.length === 0) return '<span class="no-data">—</span>';
        return arr.map(function (x) {
          return '<span class="gate-pill">' + escapeHtml(x) + '</span>';
        }).join('');
      }

      /** Group TWD LINE tokens so "NE:", "5", "13", "TE:", "7", "17" -> ["NE: 5, 13", "TE: 7, 17"] */
      function groupTwdLineTokens(arr) {
        if (!arr || arr.length === 0) return [];
        var groups = [];
        var prefix = '';
        var nums = [];
        function flush() {
          if (prefix) {
            groups.push(nums.length ? prefix + ' ' + nums.join(', ') : prefix);
            prefix = '';
            nums = [];
          }
        }
        for (var i = 0; i < arr.length; i++) {
          var t = (arr[i] || '').trim();
          if (!t) continue;
          if (t.indexOf(':') === t.length - 1) {
            flush();
            prefix = t;
          } else {
            if (prefix) nums.push(t);
            else groups.push(t);
          }
        }
        flush();
        return groups;
      }

      function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      function renderGates(record, lineKey) {
        if (!record) {
          gatesContent.innerHTML = '<div class="no-data">No data for this selection.</div>';
          return;
        }
        const liftTitle = 'Lift(s)';
        const escTitle = 'Escalator(s)';
        const stairTitle = 'Stair(s)';
        const twdTitle = 'TWD LINE (Transfer)';
        var twdPills = groupTwdLineTokens(record.twdLine);
        gatesContent.innerHTML =
          '<div class="gate-section"><div class="title">' + liftTitle + '</div><div class="gate-pills">' + renderPills(record.lifts) + '</div></div>' +
          '<div class="gate-section"><div class="title">' + escTitle + '</div><div class="gate-pills">' + renderPills(record.escalators) + '</div></div>' +
          '<div class="gate-section"><div class="title">' + stairTitle + '</div><div class="gate-pills">' + renderPills(record.stairs) + '</div></div>' +
          '<div class="gate-section"><div class="title">' + twdTitle + '</div><div class="gate-pills">' + renderPills(twdPills) + '</div></div>';
      }

      function getSelectedStationName() {
        var opt = destinationEl.options[destinationEl.selectedIndex];
        return opt ? opt.value : '';
      }

      function updateGates() {
        var lineKey = directionPanel.getAttribute('data-line') || 'EW';
        var towardsVal = towardsEl.value;
        var destVal = getSelectedStationName();
        if (!towardsVal || !destVal) {
          gatesContent.innerHTML = '<div class="no-data">Select direction and destination.</div>';
          return;
        }
        var record = findRecord(lineKey, towardsVal, destVal);
        renderGates(record, lineKey);
        saveSelection(lineKey, towardsVal, destVal);
      }

      function setLine(lineKey) {
        directionPanel.setAttribute('data-line', lineKey);
        directionPanel.className = 'panel bg-line ' + lineKey;
        var tab = document.querySelector('.line-tab[data-line="' + lineKey + '"]');
        document.querySelectorAll('.line-tab').forEach(function (t) { t.classList.remove('active'); });
        if (tab) tab.classList.add('active');

        var _get = getStationsAndTowards(lineKey);
        var stations = _get.stations;
        var towards = _get.towards;
        towardsEl.innerHTML = towards.map(function (t) {
          return '<option value="' + escapeHtml(t) + '">' + escapeHtml(t) + '</option>';
        }).join('');
        destinationEl.innerHTML = stations.map(function (name) {
          return '<option value="' + escapeHtml(name) + '">' + escapeHtml(name) + '</option>';
        }).join('');

        var saved = loadSavedSelection()[lineKey];
        var towardsIdx = 0;
        var destIdx = 0;
        if (saved && saved.towards) {
          var ti = towards.indexOf(saved.towards);
          if (ti >= 0) towardsIdx = ti;
        }
        if (saved && saved.destination) {
          var di = stations.indexOf(saved.destination);
          if (di >= 0) destIdx = di;
        }
        towardsEl.selectedIndex = towardsIdx;
        destinationEl.selectedIndex = destIdx;
        updateGates();
      }

      function init() {
        var saved = loadSavedSelection();
        var initialLine = (saved && saved.lastLine) ? saved.lastLine : 'EW';
        if (typeof window.__MRT_GATES_DATA__ !== 'undefined' && window.__MRT_GATES_DATA__ != null) {
          data = window.__MRT_GATES_DATA__;
          setLine(initialLine);
        } else {
          fetch('mrt-gates.json')
            .then(function (res) { return res.json(); })
            .then(function (json) {
              data = json;
              setLine(initialLine);
            })
            .catch(function () {
              gatesContent.innerHTML = '<div class="no-data">Failed to load data. Run: python3 scripts/excel_to_json.py</div>';
            });
        }

        document.querySelectorAll('.line-tab').forEach(function (btn) {
          btn.addEventListener('click', function () {
            setLine(btn.getAttribute('data-line'));
          });
        });
        towardsEl.addEventListener('change', updateGates);
        destinationEl.addEventListener('change', updateGates);
      }

      init();
    })();
  </script>
